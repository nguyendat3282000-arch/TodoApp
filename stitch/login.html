<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đăng nhập - TodoApp ✨</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&amp;family=Quicksand:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#2b322f",
                        "primary-container": "#8fa596",
                        "primary": "#4e6356",
                        "surface-container-highest": "#dde4df",
                        "surface-tint": "#4e6356",
                        "inverse-primary": "#b5ccbc",
                        "on-background": "#161d1a",
                        "surface-container-low": "#eef5f0",
                        "on-secondary-container": "#4f6a5b",
                        "on-error-container": "#93000a",
                        "tertiary": "#6e5b49",
                        "primary-fixed-dim": "#b5ccbc",
                        "on-secondary-fixed-variant": "#324c3e",
                        "on-tertiary-fixed": "#26190b",
                        "outline": "#737873",
                        "on-primary-fixed-variant": "#374b3f",
                        "on-error": "#ffffff",
                        "secondary-fixed-dim": "#b0cdbb",
                        "secondary-container": "#ccead6",
                        "surface-dim": "#d5dcd7",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e3eae5",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#f8dec6",
                        "surface": "#f4fbf6",
                        "surface-bright": "#f4fbf6",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#554432",
                        "on-surface": "#161d1a",
                        "on-primary-fixed": "#0c1f15",
                        "outline-variant": "#c2c8c2",
                        "background": "#f4fbf6",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#dde4df",
                        "inverse-on-surface": "#ebf2ed",
                        "secondary-fixed": "#ccead6",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#433423",
                        "on-surface-variant": "#424844",
                        "secondary": "#496455",
                        "tertiary-fixed-dim": "#dbc2ac",
                        "tertiary-container": "#b29c87",
                        "surface-container": "#e9f0eb",
                        "primary-fixed": "#d1e8d8",
                        "on-secondary-fixed": "#062014",
                        "on-primary-container": "#273b2f",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-margin": "32px",
                        "stack-gap": "16px",
                        "container-padding": "24px",
                        "base": "8px",
                        "glass-padding": "20px"
                    },
                    "fontFamily": {
                        "body-md": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "display-lg": ["Quicksand"],
                        "headline-sm": ["Quicksand"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-md": ["Quicksand"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "0em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(143, 165, 150, 0.15); /* primary-container with opacity */
            box-shadow: 0 8px 32px 0 rgba(78, 99, 86, 0.05); /* primary with opacity */
        }
        .bg-mint-gradient {
            background: linear-gradient(135deg, #f4fbf6 0%, #eef5f0 50%, #d1e8d8 100%);
        }
        .btn-gradient {
            background: linear-gradient(180deg, #4e6356 0%, #374b3f 100%);
        }
        .btn-press:active {
            transform: scale(0.98);
        }
        
        /* Floating Stars Animation */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0.8; }
            50% { transform: translateY(-10px) rotate(10deg); opacity: 1; }
            100% { transform: translateY(0px) rotate(0deg); opacity: 0.8; }
        }
        .star {
            animation: float 4s ease-in-out infinite;
        }
        .star:nth-child(even) {
            animation-duration: 5s;
            animation-delay: 1s;
        }
    </style>
</head>
<body class="bg-mint-gradient text-on-surface min-h-screen flex items-center justify-center p-container-padding font-body-md relative overflow-hidden">
<!-- Decorative Stars -->
<div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
<span class="material-symbols-outlined text-tertiary-fixed-dim absolute top-[15%] left-[20%] text-4xl star" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="material-symbols-outlined text-tertiary-fixed-dim absolute top-[30%] right-[15%] text-2xl star" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="material-symbols-outlined text-secondary-fixed-dim absolute bottom-[20%] left-[10%] text-3xl star" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="material-symbols-outlined text-primary-fixed-dim absolute bottom-[15%] right-[25%] text-4xl star" style="font-variation-settings: 'FILL' 1;">stars</span>
</div>
<!-- Main Content Container (Glassmorphic Card) -->
<main class="glass-card rounded-xl w-full max-w-md p-section-margin relative z-10 flex flex-col items-center">
<!-- Header Section -->
<div class="flex flex-col items-center mb-section-margin w-full">
<div class="w-24 h-24 mb-stack-gap relative">
<img alt="Sprout Mascot Login Reference" class="w-full h-full object-contain drop-shadow-md" src="https://lh3.googleusercontent.com/aida/AP1WRLtykOYtUvCMt6UkZ5RfmtNgVO-WTKa-v1hcwwJIQyAtZO5pv7qXwPUrrsZqptCjj0VqrW9z6icqwJWg-mkivsRFuwm4ycsGsAZXnEaWVNhpdzSP9tvA0nnrPsVvBgpwDte36cQsJSmzoEsx7Y1h8xMlTwJVxRxoLBmehVh4kwsb3bEs26jqlWjp_oTf16PaaJzTQpdp6Kk-b4J9C2hM7XDadxO5_5BbUsvhoJIz2N_TnFIFRhML38FMDThG"/>
</div>
<h1 class="text-display-lg font-display-lg text-primary text-center">TodoApp <span class="text-tertiary-fixed-dim">✨</span></h1>
<p class="text-body-md font-body-md text-on-surface-variant text-center mt-base">Chào mừng bạn quay trở lại khu vườn công việc!</p>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-stack-gap">
<!-- Email Input -->
<div class="relative w-full">
<label class="absolute -top-2 left-4 px-1 bg-surface-container-lowest text-label-md font-label-md text-primary z-10" for="email">Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline z-10">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-full py-3 pl-12 pr-4 text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors glass-card" id="email" name="email" placeholder="Nhập email của bạn" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="relative w-full mt-base">
<label class="absolute -top-2 left-4 px-1 bg-surface-container-lowest text-label-md font-label-md text-primary z-10" for="password">Mật khẩu</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline z-10">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-full py-3 pl-12 pr-12 text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors glass-card" id="password" name="password" placeholder="Nhập mật khẩu" required="" type="password"/>
<button class="absolute right-4 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="w-full flex justify-end px-2">
<a class="text-label-md font-label-md text-primary hover:text-on-primary-container transition-colors" href="#">Quên mật khẩu?</a>
</div>
<!-- Primary Action Button -->
<button class="w-full btn-gradient text-on-primary text-headline-sm font-headline-sm py-3 rounded-full mt-base shadow-lg shadow-primary/20 btn-press transition-all duration-200" type="submit">
                Đăng nhập
            </button>
</form>
<!-- Divider -->
<div class="w-full flex items-center my-section-margin gap-4">
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
<span class="text-label-md font-label-md text-outline">HOẶC</span>
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
</div>
<!-- Social Login -->
<button class="w-full bg-surface-container-lowest border border-outline-variant/30 text-on-surface text-body-md font-body-md py-3 rounded-full flex items-center justify-center gap-3 hover:bg-surface-container-low transition-colors shadow-sm glass-card btn-press" type="button">
<!-- SVG Google Icon (Standardized for minimal aesthetic) -->
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.36 10H12V14.26H17.92C17.67 15.63 16.89 16.78 15.74 17.55V20.31H19.31C21.4 18.38 22.56 15.58 22.56 12.25Z" fill="#4285F4"></path>
<path d="M12 23C14.97 23 17.46 22.02 19.31 20.31L15.74 17.55C14.74 18.22 13.48 18.64 12 18.64C9.13 18.64 6.7 16.7 5.83 14.08H2.15V16.93C3.96 20.53 7.68 23 12 23Z" fill="#34A853"></path>
<path d="M5.83 14.08C5.61 13.41 5.48 12.72 5.48 12C5.48 11.28 5.61 10.59 5.83 9.92V7.07H2.15C1.41 8.55 1 10.22 1 12C1 13.78 1.41 15.45 2.15 16.93L5.83 14.08Z" fill="#FBBC05"></path>
<path d="M12 5.36C13.62 5.36 15.06 5.92 16.2 7.02L19.39 3.83C17.45 2.02 14.97 1 12 1C7.68 1 3.96 3.47 2.15 7.07L5.83 9.92C6.7 7.3 9.13 5.36 12 5.36Z" fill="#EA4335"></path>
</svg>
            Tiếp tục với Google
        </button>
<!-- Register Link -->
<div class="mt-section-margin text-body-md font-body-md text-on-surface-variant">
            Chưa có tài khoản? <a class="text-primary font-bold hover:text-on-primary-container transition-colors" href="#">Đăng ký ngay</a>
</div>
</main>
</body></html>
