<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);

        }
        .input-pill {
            background: #ffffff;
            border: 1px solid rgba(138, 165, 150, 0.2);
            border-radius: 9999px;
            padding: 12px 20px;
            width: 100%;
            transition: all 0.3s ease;
        }
        .input-pill:focus-within {
            border-color: #8fa596;
            box-shadow: 0 0 0 4px rgba(143, 165, 150, 0.1);
        }
        .input-field {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            color: #161d1a;
        }
        .input-field::placeholder {
            color: #737873;
        }
        
        /* Textarea specific pill style */
        .textarea-pill {
            border-radius: 1.5rem;
            padding: 16px 20px;
        }
        
        .toggle-checkbox:checked {
            right: 0;
            border-color: #8fa596;
        }
        .toggle-checkbox:checked + .toggle-label {

<body class="bg-surface text-on-surface min-h-screen font-body-lg antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation Bar -->
<nav class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding py-4 bg-surface/70 backdrop-blur-xl shadow-sm shadow-primary/5">

<!-- Main Content Area -->
<main class="pt-[100px] px-container-padding pb-section-margin max-w-md mx-auto">

<!-- Form Content -->

<!-- Tiêu đề Input -->

<!-- Mô tả Input -->

</div>
</div>
<!-- Grid for Date & Time -->
<div class="grid grid-cols-2 gap-4">
<!-- Ngày thực hiện Input -->

<span class="material-symbols-outlined text-outline text-sm">calendar_month</span>
<input class="input-field font-body-md text-body-md" type="text" value="28/10/2023"/>
</div>

<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-transform duration-300 ease-in-out z-10 translate-x-6 border-primary-container" id="toggle" name="toggle" type="checkbox"/>

</div>

                    Lưu thay đổi
                </button>

</main>
<script>
        // Simple toggle interaction logic for demonstration
        const toggleCheckbox = document.getElementById('toggle');
        const toggleLabel = document.querySelector('.toggle-label');

        toggleCheckbox.addEventListener('change', function() {
            if(this.checked) {
                this.classList.add('translate-x-6', 'border-primary-container');
                this.classList.remove('translate-x-0', 'border-outline-variant');
                toggleLabel.classList.add('bg-primary-container');
                toggleLabel.classList.remove('bg-surface-variant');
            } else {
                this.classList.remove('translate-x-6', 'border-primary-container');
                this.classList.add('translate-x-0', 'border-outline-variant');
                toggleLabel.classList.remove('bg-primary-container');
                toggleLabel.classList.add('bg-surface-variant');
            }
        });
        
        // Initialize toggle visual state if needed based on default checked status
        if(!toggleCheckbox.checked) {
             toggleCheckbox.classList.remove('translate-x-6', 'border-primary-container');
             toggleCheckbox.classList.add('translate-x-0', 'border-outline-variant');
             toggleLabel.classList.remove('bg-primary-container');
             toggleLabel.classList.add('bg-surface-variant');
        }
    </script>
