<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(78, 99, 86, 0.05);
        }
        
        .progress-ring__circle {
            transition: stroke-dashoffset 0.8s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .wave-path {
            animation: wave 10s linear infinite;
        }

        @keyframes wave {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        body {
            /* Fallback background image using provided reference if needed, but styling mostly prefers solid colors */
            background-color: theme('colors.background');
        }
    </style>

<body class="bg-background text-on-background min-h-screen pb-32">
<!-- Main Content Canvas -->
<main class="max-w-md mx-auto relative pt-12 px-container-padding">
<!-- Header -->
<header class="mb-section-margin text-center">
<h1 class="font-headline-md text-headline-md text-primary">Thống kê</h1>
</header>
<!-- Tabs -->
<div class="flex justify-center gap-stack-gap mb-section-margin">
<button class="font-headline-sm text-headline-sm text-primary border-b-2 border-primary pb-1 px-2">Tuần</button>
<button class="font-headline-sm text-headline-sm text-outline pb-1 px-2">Tháng</button>
</div>
<!-- Health Score Card (Bento Style) -->
<section class="glass-panel rounded-xl p-glass-padding mb-section-margin flex flex-col items-center">
<h2 class="font-headline-sm text-headline-sm text-primary mb-4 w-full text-center">Health Score Tuần</h2>
<div class="relative w-40 h-40 flex items-center justify-center">
<svg class="w-full h-full" viewBox="0 0 100 100">
<circle class="text-surface-variant stroke-current" cx="50" cy="50" fill="transparent" r="40" stroke-width="8"></circle>
<circle class="text-primary stroke-current progress-ring__circle" cx="50" cy="50" fill="transparent" r="40" stroke-dasharray="251.2" stroke-dashoffset="62.8" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="font-display-lg text-display-lg text-primary">75</span>
<span class="font-label-md text-label-md text-on-surface-variant">/100</span>
</div>
</div>
<p class="mt-4 font-body-md text-body-md text-center text-on-surface-variant">Tuyệt vời! Bạn đang duy trì phong độ rất tốt.</p>
</section>
<!-- Chart Section -->
<section class="glass-panel rounded-xl p-glass-padding mb-section-margin overflow-hidden relative">
<h2 class="font-headline-sm text-headline-sm text-primary mb-4">Thống kê hoàn thành</h2>
<!-- Soft Wave Chart Placeholder -->
<div class="h-32 w-full relative -mx-glass-padding">
<svg class="absolute bottom-0 w-[200%] h-full" preserveAspectRatio="none" viewBox="0 0 1000 100">
<path class="wave-path text-primary-container fill-current opacity-30" d="M0,50 Q125,0 250,50 T500,50 T750,50 T1000,50 L1000,100 L0,100 Z"></path>
<path class="wave-path text-primary fill-current opacity-20" d="M0,70 Q125,20 250,70 T500,70 T750,70 T1000,70 L1000,100 L0,100 Z" style="animation-duration: 7s; animation-direction: reverse;"></path>
</svg>
</div>
<div class="absolute bottom-glass-padding left-glass-padding right-glass-padding flex justify-between font-label-md text-label-md text-on-surface-variant">
<span class="">T2</span><span class="">T3</span><span class="">T4</span><span class="">T5</span><span class="">T6</span><span class="">T7</span><span class="">CN</span>
</div>
</section>
<!-- Incomplete Tasks List -->
<section class="mb-section-margin">
<h2 class="font-headline-sm text-headline-sm text-primary mb-stack-gap">Chưa hoàn thành</h2>
<div class="space-y-stack-gap">
<!-- Task Item 1 -->
<div class="glass-panel rounded-lg p-4 flex items-center gap-4">
<div class="w-6 h-6 rounded-full border-2 border-outline flex-shrink-0 cursor-pointer"></div>
<div class="flex-1">
<p class="font-body-lg text-body-lg text-on-surface">Đọc sách 30 phút</p>
<p class="font-body-md text-body-md text-on-surface-variant">T2, T3</p>
</div>
</div>
<!-- Task Item 2 -->
<div class="glass-panel rounded-lg p-4 flex items-center gap-4">
<div class="w-6 h-6 rounded-full border-2 border-outline flex-shrink-0 cursor-pointer"></div>
<div class="flex-1">
<p class="font-body-lg text-body-lg text-on-surface">Uống đủ nước</p>
<p class="font-body-md text-body-md text-on-surface-variant">Hôm nay</p>
</div>
</div>
</div>
</section>
</main>
